# Willama-chat — configurazione di esempio (copiare in librechat.yaml)
#   cp willama.example.yaml librechat.yaml
# Il file librechat.yaml è ignorato da git: contiene la configurazione del vostro ambiente.
version: 1.3.18

cache: true

endpoints:
  custom:
    # OpenRouter — la chiave va in .env come OPENROUTER_KEY=sk-or-v1-...
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        # Elenco mostrato se il recupero dinamico fallisce; con fetch: true
        # vengono caricati tutti i modelli disponibili su OpenRouter.
        default:
          - 'openai/gpt-4o-mini'
          - 'anthropic/claude-sonnet-4.5'
          - 'google/gemini-2.5-flash'
          - 'meta-llama/llama-3.3-70b-instruct'
        fetch: true
      titleConvo: true
      titleModel: 'openai/gpt-4o-mini'
      # OpenRouter instrada su modelli con token di stop diversi: meglio non inviarlo.
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'
